<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercii | Luxury Cars</title> 
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: #141414;
            --accent-color: #d4af37;
            --text-color: #f5f5f5;
            --text-muted: #aaaaaa;
            --border-color: #262626;
            --danger-color: #e74c3c;
            --success-color: #2ecc71;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        header {
            position: relative;
            text-align: center;
            padding: 60px 20px;
            background: linear-gradient(to bottom, #1a1a1a, var(--bg-color));
            border-bottom: 1px solid var(--border-color);
        }

        .admin-nav-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: transparent;
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .admin-nav-btn:hover {
            background: var(--accent-color);
            color: var(--bg-color);
        }

        header h1 {
            font-size: 3rem;
            letter-spacing: 4px;
            color: var(--accent-color);
            margin-bottom: 10px;
            font-weight: 700;
        }

        header p {
            font-size: 1.1rem;
            letter-spacing: 2px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .action-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 50px;
        }

        .btn-main {
            background-color: transparent;
            color: var(--accent-color);
            border: 2px solid var(--accent-color);
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1px;
            border-radius: 4px;
        }

        .btn-main:hover {
            background-color: var(--accent-color);
            color: var(--bg-color);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }

        .section-title {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2rem;
            letter-spacing: 2px;
            color: var(--text-color);
        }

        .cars-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            margin-bottom: 60px;
        }

        .car-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .car-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            border-color: var(--accent-color);
        }

        .car-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .car-info {
            padding: 20px;
            text-align: center;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .car-info h3 {
            font-size: 1.3rem;
            margin-bottom: 8px;
            color: var(--text-color);
        }

        .car-info p {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        .car-price {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent-color);
        }

        .form-section {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 40px;
            border-radius: 8px;
            max-width: 650px;
            margin: 0 auto 60px auto;
        }

        .form-section h2 {
            text-align: center;
            margin-bottom: 25px;
            color: var(--accent-color);
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 12px;
            background-color: #0b0b0b;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 4px;
            font-size: 1rem;
        }

        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-color);
            color: var(--bg-color);
            border: none;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 4px;
            transition: opacity 0.3s ease;
        }

        .btn-submit:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        .btn-submit:hover:not(:disabled) {
            opacity: 0.9;
        }

        #adminPanelSection {
            display: none;
            border: 2px dashed var(--accent-color);
            margin-bottom: 40px;
            max-width: 1000px;
        }

        .source-selector {
            display: flex;
            gap: 15px;
            margin-bottom: 12px;
        }

        .source-btn {
            flex: 1;
            padding: 8px;
            background: #0b0b0b;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .source-btn.active {
            border-color: var(--accent-color);
            color: var(--accent-color);
            background: #1a1a1a;
        }

        .admin-cars-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 30px;
        }

        .admin-car-item {
            background: #181818;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            position: relative;
        }

        .admin-car-item:hover {
            border-color: var(--accent-color);
        }

        .admin-car-img-container {
            width: 180px;
            height: 120px;
            flex-shrink: 0;
            position: relative;
            border-radius: 6px;
            overflow: hidden;
        }

        .admin-car-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .btn-edit-img {
            position: absolute;
            bottom: 5px;
            left: 5px;
            right: 5px;
            background: rgba(0,0,0,0.8);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 4px;
            font-size: 0.75rem;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
        }

        .admin-car-details {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .detail-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .detail-row h3, .detail-row p, .detail-row span {
            margin: 0;
        }

        .btn-mini-edit {
            background: transparent;
            border: none;
            color: var(--accent-color);
            cursor: pointer;
            font-size: 0.85rem;
            padding: 2px 6px;
            border-radius: 3px;
        }

        .btn-mini-edit:hover {
            background: rgba(212, 175, 55, 0.2);
        }

        .admin-delete-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: transparent;
            color: var(--danger-color);
            border: 1px solid var(--danger-color);
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .admin-delete-btn:hover {
            background: var(--danger-color);
            color: white;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--accent-color);
            padding: 30px;
            border-radius: 8px;
            width: 90%;
            max-width: 450px;
            position: relative;
        }

        .close-modal {
            position: absolute;
            top: 10px;
            right: 15px;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
        }

        footer {
            text-align: center;
            padding: 40px 20px;
            background-color: #080808;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        footer .phone {
            color: var(--accent-color);
            font-weight: 600;
            margin-top: 10px;
            font-size: 1.1rem;
        }

        @media (max-width: 768px) {
            .admin-car-item {
                flex-direction: column;
                align-items: flex-start;
            }
            .admin-car-img-container {
                width: 100%;
                height: 180px;
            }
            .admin-delete-btn {
                top: 10px;
                right: 10px;
            }
        }
    </style>
</head>
<body>

    <header>
        <button class="admin-nav-btn" id="adminAuthBtn" onclick="toggleAdminModal()">🔑 Admin Girişi</button>
        <h1>MERCII</h1>
        <p>Drive Beyond Ordinary &bull; Luxury Cars &middot; Sales & Rental</p>
    </header>

    <div class="container">
        
        <div class="form-section" id="adminPanelSection">
            <h2>🏎️ Admin İdarəetmə Paneli</h2>
            <form id="addCarForm">
                <div class="form-group">
                    <label>Maşın Modeli / Adı</label>
                    <input type="text" id="car_name" placeholder="Məs: Ferrari F8 Tributo" required>
                </div>
                <div class="form-group">
                    <label>Təsviri (Məlumat)</label>
                    <input type="text" id="car_desc" placeholder="Məs: High performance V8 engine..." required>
                </div>
                <div class="form-group">
                    <label>Qiyməti (AZN)</label>
                    <input type="text" id="car_price" placeholder="Məs: 550,000 AZN" required>
                </div>
                
                <div class="form-group">
                    <label>Şəkil Əlavə Etmə Yolu</label>
                    <div class="source-selector">
                        <button type="button" class="source-btn active" id="btnSourceFile" onclick="switchImageSource('file')">📁 Cihaz Yaddaşından (Fayl)</button>
                        <button type="button" class="source-btn" id="btnSourceUrl" onclick="switchImageSource('url')">🔗 Şəkil URL-i ilə</button>
                    </div>

                    <div id="fileUploadContainer">
                        <input type="file" id="car_img_file" accept="image/*">
                    </div>

                    <div id="urlUploadContainer" style="display: none;">
                        <input type="url" id="car_img_url" placeholder="https://images.unsplash.com/...">
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="addCarBtn">+ Yeni Maşın Əlavə Et</button>
            </form>

            <hr style="border-color: var(--border-color); margin: 40px 0 30px 0;">

            <h3 style="color: var(--accent-color); text-align: center; margin-bottom: 20px;">📋 Mövcud Maşınların Siyahısı və Düzəliş</h3>
            
            <div class="admin-cars-list" id="adminCarsContainer"></div>
        </div>

        <div class="action-bar" id="actionBar">
            <button class="btn-main" onclick="scrollToForm()">Maşın Kirayələ</button>
            <button class="btn-main" onclick="scrollToForm()">Maşın Al</button>
        </div>

        <h2 class="section-title">Exclusive Fleet</h2>

        <div class="cars-grid" id="carsContainer"></div>

        <div class="form-section" id="register-form">
            <h2>Məlumatların Daxil Edilməsi və Qeydiyyat</h2>

            <form id="merciiForm">
                <div class="form-group">
                    <label>Ad və Soyad</label>
                    <input type="text" id="full_name" placeholder="Məsələn: Elmir Məmmədov" required>
                </div>
                <div class="form-group">
                    <label>Gmail (E-poçt)</label>
                    <input type="email" id="email" placeholder="example@gmail.com" required>
                </div>
                <div class="form-group">
                    <label>Şifrə (SHA-256 Kriptoqrafik Hash ilə qorunacaq)</label>
                    <input type="password" id="password" placeholder="********" required>
                </div>
                <div class="form-group">
                    <label>Bank Kartı Nömrəsi (SHA-256 ilə Təhlükəsiz Heşlənəcək)</label>
                    <input type="text" id="card_number" placeholder="4169 ... .... ...." required>
                </div>
                <button type="submit" class="btn-submit" id="submitBtn">Təsdiq Et</button>
            </form>
        </div>

    </div>

    <div class="modal" id="adminModal">
        <div class="modal-content">
            <span class="close-modal" onclick="toggleAdminModal()">&times;</span>
            <h2 style="color: var(--accent-color); margin-bottom: 20px; text-align: center;">Admin Daxil Ol</h2>
            <form id="adminLoginForm">
                <div class="form-group">
                    <label>Admin E-poçt</label>
                    <input type="email" id="adminEmail" required placeholder="admin@mercii.com">
                </div>
                <div class="form-group">
                    <label>Şifrə</label>
                    <input type="password" id="adminPassword" required placeholder="********">
                </div>
                <button type="submit" class="btn-submit">Daxil Ol</button>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Mercii Luxury Cars. Bütün hüquqlar qorunur.</p>
        <p class="phone">Əlaqə nömrəsi: +994 55 287 34 17</p>
    </footer>

    <script>
        function scrollToForm() {
            const formSection = document.getElementById('register-form');
            if (formSection && formSection.style.display !== 'none') {
                formSection.scrollIntoView({ behavior: 'smooth' });
            }
        }

        function toggleAdminModal() {
            const modal = document.getElementById('adminModal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        }

        const SUPABASE_URL = 'https://tzapdwrqsludewcdmrhd.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_pvYIagFZYXCvaaxHlsXXWg_SDb7jh8R'; 

        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let isAdminLoggedIn = false;
        let selectedImageType = 'file';

        function switchImageSource(type) {
            selectedImageType = type;
            const btnFile = document.getElementById('btnSourceFile');
            const btnUrl = document.getElementById('btnSourceUrl');
            const containerFile = document.getElementById('fileUploadContainer');
            const containerUrl = document.getElementById('urlUploadContainer');

            if (type === 'file') {
                btnFile.classList.add('active');
                btnUrl.classList.remove('active');
                containerFile.style.display = 'block';
                containerUrl.style.display = 'none';
            } else {
                btnUrl.classList.add('active');
                btnFile.classList.remove('active');
                containerUrl.style.display = 'block';
                containerFile.style.display = 'none';
            }
        }

        async function loadCars() {
            const userContainer = document.getElementById('carsContainer');
            const adminContainer = document.getElementById('adminCarsContainer');
            
            userContainer.innerHTML = '';
            if (adminContainer) adminContainer.innerHTML = '';

            let { data: cars, error } = await _supabase.from('cars').select('*').order('created_at', { ascending: false });

            if (error) {
                console.error('Maşınlar yüklənərkən xəta:', error.message);
                return;
            }

            if (!cars) cars = [];

            cars.forEach(car => {
                const card = document.createElement('div');
                card.className = 'car-card';
                card.innerHTML = `
                    <img src="${car.img}" alt="${car.name}" class="car-img" onerror="this.src='https://via.placeholder.com/600x400?text=No+Image'">
                    <div class="car-info">
                        <h3>${car.name}</h3>
                        <p>${car.desc}</p>
                        <div class="car-price">${car.price}</div>
                    </div>
                `;
                userContainer.appendChild(card);
            });

            if (isAdminLoggedIn && adminContainer) {
                cars.forEach(car => {
                    const item = document.createElement('div');
                    item.className = 'admin-car-item';
                    item.innerHTML = `
                        <button class="admin-delete-btn" onclick="deleteCar(${car.id})" title="Sil">🗑️</button>
                        <div class="admin-car-img-container">
                            <img src="${car.img}" class="admin-car-img" onerror="this.src='https://via.placeholder.com/300x200?text=No+Image'">
                            <button class="btn-edit-img" onclick="editCarImage(${car.id})">📷 Şəkli Dəyiş</button>
                        </div>
                        <div class="admin-car-details">
                            <div class="detail-row">
                                <h3 style="color: var(--accent-color);">${car.name}</h3>
                                <button class="btn-mini-edit" onclick="editCarField(${car.id}, 'name', '${escapeQuotes(car.name)}')">✏️ Düzəliş et</button>
                            </div>
                            <div class="detail-row">
                                <p style="color: var(--text-muted); font-size: 0.9rem;">${car.desc}</p>
                                <button class="btn-mini-edit" onclick="editCarField(${car.id}, 'desc', '${escapeQuotes(car.desc)}')">✏️ Düzəliş et</button>
                            </div>
                            <div class="detail-row">
                                <span style="font-weight: 700; color: white;">${car.price}</span>
                                <button class="btn-mini-edit" onclick="editCarField(${car.id}, 'price', '${escapeQuotes(car.price)}')">✏️ Düzəliş et</button>
                            </div>
                        </div>
                    `;
                    adminContainer.appendChild(item);
                });
            }
        }

        function escapeQuotes(str) {
            return (str || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }

        document.getElementById('adminLoginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;

            const { data, error } = await _supabase.auth.signInWithPassword({ email, password });

            if (error) {
                alert('Giriş xətası: ' + error.message);
            } else {
                alert('Admin kimi uğurla daxil oldunuz!');
                isAdminLoggedIn = true;
                toggleAdminModal();
                
                document.getElementById('adminAuthBtn').innerText = '🚪 Çıxış Et';
                document.getElementById('adminAuthBtn').onclick = logoutAdmin;
                document.getElementById('adminPanelSection').style.display = 'block';
                document.getElementById('register-form').style.display = 'none';
                document.getElementById('actionBar').style.display = 'none';
                
                loadCars();
            }
        });

        async function logoutAdmin() {
            await _supabase.auth.signOut();
            isAdminLoggedIn = false;
            alert('Admin panelindən çıxış edildi.');
            
            document.getElementById('adminAuthBtn').innerText = '🔑 Admin Girişi';
            document.getElementById('adminAuthBtn').onclick = toggleAdminModal;
            document.getElementById('adminPanelSection').style.display = 'none';
            document.getElementById('register-form').style.display = 'block';
            document.getElementById('actionBar').style.display = 'flex';
            
            loadCars();
        }

        async function uploadImageToStorage(file) {
            const fileExt = file.name.split('.').pop();
            const fileName = `${Date.now()}_${Math.random().toString(36).substring(2, 7)}.${fileExt}`;
            const filePath = `${fileName}`;

            const { data, error } = await _supabase.storage
                .from('car-images')
                .upload(filePath, file);

            if (error) throw error;

            const { data: publicUrlData } = _supabase.storage
                .from('car-images')
                .getPublicUrl(filePath);

            return publicUrlData.publicUrl;
        }

        document.getElementById('addCarForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('addCarBtn');
            btn.disabled = true;
            btn.innerText = 'Yüklənir...';

            try {
                const name = document.getElementById('car_name').value;
                const desc = document.getElementById('car_desc').value;
                const price = document.getElementById('car_price').value;
                let imgUrl = '';

                if (selectedImageType === 'file') {
                    const fileInput = document.getElementById('car_img_file');
                    if (!fileInput.files || fileInput.files.length === 0) {
                        alert('Xahiş olunur cihaz yaddaşından bir şəkil faylı seçin!');
                        btn.disabled = false;
                        btn.innerText = '+ Yeni Maşın Əlavə Et';
                        return;
                    }
                    imgUrl = await uploadImageToStorage(fileInput.files[0]);
                } else {
                    imgUrl = document.getElementById('car_img_url').value;
                    if (!imgUrl) {
                        alert('Xahiş olunur şəkil URL-i daxil edin!');
                        btn.disabled = false;
                        btn.innerText = '+ Yeni Maşın Əlavə Et';
                        return;
                    }
                }

                const { data, error } = await _supabase.from('cars').insert([{ name, desc, price, img: imgUrl }]);

                if (error) {
                    alert('Maşın əlavə edilərkən xəta: ' + error.message);
                } else {
                    alert('Yeni maşın uğurla əlavə edildi!');
                    document.getElementById('addCarForm').reset();
                    loadCars();
                }
            } catch (err) {
                alert('Xəta baş verdi: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = '+ Yeni Maşın Əlavə Et';
            }
        });

        async function editCarField(id, field, currentValue) {
            const fieldNames = { name: 'Adını', desc: 'Təsvirini', price: 'Qiymətini' };
            const newValue = prompt(`Maşının yeni ${fieldNames[field]} daxil edin:`, currentValue);

            if (newValue !== null && newValue.trim() !== '') {
                const updateData = {};
                updateData[field] = newValue.trim();

                const { error } = await _supabase.from('cars').update(updateData).eq('id', id);

                if (error) {
                    alert('Yeniləmə xətası: ' + error.message);
                } else {
                    loadCars();
                }
            }
        }

        async function editCarImage(id) {
            const choice = prompt("Şəkli necə yeniləmək istəyirsiniz?\n1 - Cihazdan yükləmək (1 yazın)\n2 - URL linki ilə (2 yazın)");

            if (choice === '1') {
                const fileInput = document.createElement('input');
                fileInput.type = 'file';
                fileInput.accept = 'image/*';
                fileInput.onchange = async () => {
                    if (fileInput.files && fileInput.files[0]) {
                        try {
                            const newUrl = await uploadImageToStorage(fileInput.files[0]);
                            const { error } = await _supabase.from('cars').update({ img: newUrl }).eq('id', id);
                            if (error) alert('Xəta: ' + error.message);
                            else loadCars();
                        } catch (err) {
                            alert('Şəkil yüklənərkən xəta: ' + err.message);
                        }
                    }
                };
                fileInput.click();
            } else if (choice === '2') {
                const newUrl = prompt("Yeni şəkil URL-ni daxil edin:");
                if (newUrl && newUrl.trim() !== '') {
                    const { error } = await _supabase.from('cars').update({ img: newUrl.trim() }).eq('id', id);
                    if (error) alert('Xəta: ' + error.message);
                    else loadCars();
                }
            }
        }

        async function deleteCar(id) {
            if (confirm('Bu maşını silməyə əminsiniz?')) {
                const { error } = await _supabase.from('cars').delete().eq('id', id);
                if (error) {
                    alert('Silinmə xətası: ' + error.message);
                } else {
                    alert('Maşın uğurla silindi!');
                    loadCars();
                }
            }
        }

        async function sha256(text) {
            const msgUint8 = new TextEncoder().encode(text);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        document.getElementById('merciiForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = 'Gözləyin...';

            const fullName = document.getElementById('full_name').value;
            const email = document.getElementById('email').value;
            const rawPassword = document.getElementById('password').value;
            const cardNumber = document.getElementById('card_number').value;

            const hashedPassword = await sha256(rawPassword);
            const hashedCard = await sha256(cardNumber);

            const { data, error } = await _supabase
                .from('users')
                .insert([
                    { 
                        full_name: fullName, 
                        email: email, 
                        password_hash: hashedPassword, 
                        card_number_encrypted: hashedCard 
                    }
                ]);

            if (error) {
                alert('Xəta baş verdi: ' + error.message);
            } else {
                alert('Təbrik edirik! Məlumatlar SHA-256 ilə tam təhlükəsiz şəkildə bulud bazasına yazıldı.');
                document.getElementById('merciiForm').reset();
            }

            submitBtn.disabled = false;
            submitBtn.innerText = 'Təsdiq Et';
        });

        loadCars();
    </script>
</body>
